<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>subtrack · конвейер</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .cv-card { border: 1px solid var(--border, #444); border-radius: 10px; padding: 14px 18px; margin: 14px 0; }
    .cv-task { font-size: 1.15rem; font-weight: 600; margin: 0 0 6px; }
    .cv-phase { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; }
    .cv-phase.ok { background: #143d21; color: #4ade80; }
    .cv-phase.warn { background: #3d2e14; color: #fbbf24; }
    .cv-phase.err { background: #3d1414; color: #f87171; }
    .cv-phase.info { background: #14273d; color: #60a5fa; }
    .cv-links a { margin-right: 12px; font-size: .85rem; }
    .cv-tl { list-style: none; padding: 0; margin: 10px 0 0; }
    .cv-tl li { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid rgba(128,128,128,.15); line-height: 1.45; }
    .cv-ts { flex: 0 0 52px; opacity: .65; font-variant-numeric: tabular-nums; }
    .cv-dot { flex: 0 0 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: #60a5fa; }
    .cv-dot.ok { background: #4ade80; } .cv-dot.warn { background: #fbbf24; } .cv-dot.err { background: #f87171; }
    .cv-next { opacity: .8; font-style: italic; }
    .cv-empty { opacity: .6; padding: 30px 0; }
  </style>
</head>
